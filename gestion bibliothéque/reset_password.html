<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Fonction pour valider le formulaire avant l'envoi
    function validateForm(event) {
      event.preventDefault();

      const newPassword = document.getElementById("new_password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      // Vérifier si les mots de passe correspondent
      if (newPassword !== confirmPassword) {
        alert("Les mots de passe ne correspondent pas. Veuillez vérifier.");
        return;
      }

      // Si tout est correct, soumettre le formulaire
      document.getElementById("resetForm").submit();
    }
  </script>
</head>
<body>

  <div class="reset-password-container">
    <h1>Réinitialiser votre mot de passe</h1>
    <form id="resetForm" action="reset_password_handler.php" method="POST" onsubmit="validateForm(event)">
      <div class="input-group">
        <label for="email">Adresse Email</label>
        <input type="email" id="email" name="email" placeholder="Entrez votre email" required>
      </div>
      <div class="input-group">
        <label for="old_password">Ancien Mot de Passe</label>
        <input type="password" id="old_password" name="old_password" placeholder="Entrez votre ancien mot de passe" required>
      </div>
      <div class="input-group">
        <label for="new_password">Nouveau Mot de Passe</label>
        <input type="password" id="new_password" name="new_password" placeholder="Entrez votre nouveau mot de passe" required>
      </div>
      <div class="input-group">
        <label for="confirm_password">Confirmer le Mot de Passe</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmez votre mot de passe" required>
      </div>
      <button type="submit">Mettre à jour le mot de passe</button>
    </form>
  </div>

</body>
</html>
