<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tous les livres</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #4b1f5d;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Tous les livres disponibles</h2>
  <table>
    <tr>
      <th>Nom du livre</th>
      <th>Auteur</th>
      <th>Disponibilité</th>
    </tr>
    <tr>
      <td>Exemple de livre 1</td>
      <td>Auteur 1</td>
      <td>Disponible</td>
    </tr>
  </table>
</body>
</html>
