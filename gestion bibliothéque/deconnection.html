<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déconnexion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #4b1f5d;
      color: white;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: flex-end; /* Place le contenu à droite */
      align-items: flex-end; /* Place le contenu en bas */
      height: 100vh; /* Occupe toute la hauteur de la page */
      box-sizing: border-box;
    }
    button {
      background-color: #8e44ad;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 5px;
      margin: 20px;
      cursor: pointer;
    }
    button:hover {
      background-color: #732d91;
    }
  </style>
  <script>
    function confirmLogout() {
      // Affiche une fenêtre de confirmation
      var confirmation = confirm("Êtes-vous sûr de vouloir vous déconnecter ?");
      
      if (confirmation) {
        // Si l'utilisateur clique sur "OK", redirige vers page1.php
        console.log("Déconnexion confirmée, redirection vers page1.php"); // Vérification dans la console
        window.location.href = "page1.php"; // Assurez-vous que ce fichier existe
      } else {
        console.log("Déconnexion annulée"); // Vérification dans la console
      }
    }
  </script>
</head>
<body>
  <button onclick="confirmLogout()">Déconnexion</button>
</body>
</html>
